name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで新しい実行が始まったら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint・ビルド・画面のテスト
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # 外部のアクションは、タグではなくコミットの番号で固定する
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      # package-lock.json のとおりに入れる（実行のたびに版が変わらないように）
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      # 内容の点検 → 型チェック → ビルド
      - run: npm run build
      - name: テスト用のブラウザーを入れる
        run: npx playwright install --with-deps chromium webkit
      - name: 画面のテスト（PC・Android・iPhone の 3 通り）
        run: npm run test:e2e
